<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Inventory Hub</title>
<style>
  :root{
    --bg-0:#0a0e17; --bg-1:#131327;
    --card:rgba(255,255,255,0.035); --card-border:rgba(255,255,255,0.08);
    --text-0:#f3f5fa; --text-1:#aab1c4; --text-2:#6b7286;
    --violet:#8b5cf6; --violet-2:#6d3fd6;
    --green:#2fae7a; --amber:#e0a934; --red:#e05a5a;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;}
  body{
    background:
      radial-gradient(1000px 480px at 85% -10%, rgba(139,92,246,0.16), transparent 60%),
      var(--bg-0);
    color:var(--text-0); min-height:100vh; padding:26px 24px 60px;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:1200px; margin:0 auto; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .back{ color:var(--text-1); font-size:13px; padding:7px 13px; border:1px solid var(--card-border); border-radius:9px; }
  .back:hover{ color:var(--text-0); border-color:rgba(255,255,255,0.2); }

  .header{ display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:14px; margin:20px 0 28px; }
  h1{ font-size:30px; font-weight:800; background:linear-gradient(180deg,#fff,#c9b8f5); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .header p{ color:var(--text-2); font-size:14px; margin-top:4px; }
  .actions{ display:flex; gap:10px; }
  .btn{ border:none; cursor:pointer; border-radius:10px; padding:11px 18px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:7px; transition:filter .15s ease, transform .15s ease; }
  .btn:hover{ filter:brightness(1.1); transform:translateY(-1px); }
  .btn-ghost{ background:var(--card); border:1px solid var(--card-border); color:var(--text-0); }
  .btn-primary{ background:linear-gradient(135deg,var(--violet),var(--violet-2)); color:#fff; box-shadow:0 8px 22px rgba(139,92,246,0.3); }

  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:26px; }
  .stat-card{ background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:20px; display:flex; gap:14px; align-items:center; }
  .stat-icon{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .stat-icon.violet{ background:rgba(139,92,246,0.15); }
  .stat-icon.green{ background:rgba(47,174,122,0.15); }
  .stat-icon.amber{ background:rgba(224,169,52,0.15); }
  .stat-icon.blue{ background:rgba(79,124,245,0.15); }
  .stat-label{ font-size:12.5px; color:var(--text-2); margin-bottom:3px; }
  .stat-value{ font-size:22px; font-weight:800; }

  .controls{ display:flex; flex-wrap:wrap; gap:12px; background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:14px 16px; margin-bottom:20px; }
  .search-box{ flex:1; min-width:220px; display:flex; align-items:center; gap:8px; }
  .search-box input{ flex:1; background:transparent; border:none; outline:none; color:var(--text-0); font-size:14.5px; }
  .search-box input::placeholder{ color:var(--text-2); }
  select{ background:var(--bg-1); color:var(--text-0); border:1px solid var(--card-border); border-radius:9px; padding:9px 12px; font-size:13.5px; outline:none; }

  .table-wrap{ background:var(--card); border:1px solid var(--card-border); border-radius:16px; overflow:hidden; }
  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:11.5px; letter-spacing:0.04em; color:var(--text-2); padding:16px 18px; border-bottom:1px solid var(--card-border); cursor:pointer; user-select:none; white-space:nowrap; }
  th:hover{ color:var(--text-0); }
  td{ padding:15px 18px; border-bottom:1px solid rgba(255,255,255,0.05); font-size:14px; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:rgba(255,255,255,0.02); }
  .pid{ background:rgba(139,92,246,0.15); color:#c9b8f5; padding:4px 9px; border-radius:7px; font-size:12px; font-weight:700; }
  .pname{ font-weight:700; }
  .stock-pill{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:20px; }
  .stock-pill.in{ background:rgba(47,174,122,0.15); color:#4fd39a; }
  .stock-pill.low{ background:rgba(224,169,52,0.15); color:#f0c15a; }
  .stock-pill.out{ background:rgba(224,90,90,0.15); color:#f08787; }
  .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .row-actions{ display:flex; gap:8px; }
  .icon-btn{ width:32px; height:32px; border-radius:8px; border:1px solid var(--card-border); background:transparent; color:var(--text-1); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .icon-btn:hover{ background:rgba(255,255,255,0.06); color:var(--text-0); }
  .icon-btn.danger:hover{ background:rgba(224,90,90,0.15); color:#f08787; border-color:rgba(224,90,90,0.3); }
  .empty-row td{ text-align:center; padding:50px; color:var(--text-2); }

  .overlay{ position:fixed; inset:0; background:rgba(5,7,12,0.6); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay.show{ display:flex; }
  .modal{ background:#12121f; border:1px solid var(--card-border); border-radius:18px; padding:28px; width:100%; max-width:420px; }
  .modal h3{ font-size:19px; font-weight:700; margin-bottom:20px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-2); margin-bottom:6px; }
  .field input, .field select{ width:100%; background:var(--bg-1); border:1px solid var(--card-border); border-radius:9px; padding:10px 12px; color:var(--text-0); font-size:14px; outline:none; }
  .field input:focus, .field select:focus{ border-color:var(--violet); }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .modal-actions .btn{ flex:1; justify-content:center; }

  @media (max-width:900px){ .stats{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px){ .stats{ grid-template-columns:1fr; } .table-wrap{ overflow-x:auto; } table{ min-width:700px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="back" href="index.html">← All Labs</a></div>

  <div class="header">
    <div>
      <h1>Product Inventory Hub</h1>
      <p>Manage, track, and analyze product inventory</p>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="resetData()">↺ Reset Data</button>
      <button class="btn btn-primary" onclick="openModal()">+ Add Product</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <div class="search-box">🔍 <input id="searchInput" type="text" placeholder="Search by ID, name, brand, or category..."></div>
    <select id="categoryFilter"><option value="All">All Categories</option></select>
    <select id="stockFilter">
      <option value="All">All Stock Levels</option>
      <option value="in">In Stock (20+)</option>
      <option value="low">Low Stock (1–19)</option>
      <option value="out">Out of Stock (0)</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="setSort('id')">PRODUCT ID</th>
          <th onclick="setSort('name')">PRODUCT NAME</th>
          <th onclick="setSort('brand')">BRAND</th>
          <th onclick="setSort('category')">CATEGORY</th>
          <th onclick="setSort('price')">PRICE</th>
          <th onclick="setSort('stock')">STOCK</th>
          <th>ACTIONS</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Add Product</h3>
    <div class="field"><label>Product Name</label><input id="fName" type="text" placeholder="e.g. Wireless Mouse"></div>
    <div class="field"><label>Brand</label><input id="fBrand" type="text" placeholder="e.g. Logitech"></div>
    <div class="field"><label>Category</label>
      <select id="fCategory">
        <option>Electronics</option><option>Computer</option><option>Accessories</option>
        <option>Wearables</option><option>Gaming</option>
      </select>
    </div>
    <div class="field"><label>Price (₹)</label><input id="fPrice" type="number" min="0" placeholder="e.g. 1999"></div>
    <div class="field"><label>Stock Quantity</label><input id="fStock" type="number" min="0" placeholder="e.g. 40"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveProduct()">Save Product</button>
    </div>
  </div>
</div>

<script>
const seedData = [
  {id:"P101", name:"Smartphone", brand:"Samsung", category:"Electronics", price:50000, stock:25},
  {id:"P102", name:"Laptop", brand:"Dell", category:"Computer", price:85000, stock:15},
  {id:"P103", name:"Headphones", brand:"Sony", category:"Accessories", price:12000, stock:40},
  {id:"P104", name:"Smart Watch", brand:"Apple", category:"Wearables", price:39000, stock:18},
  {id:"P105", name:"Tablet", brand:"iPad", category:"Electronics", price:55000, stock:12},
  {id:"P106", name:"Mechanical Keyboard", brand:"Logitech", category:"Computer", price:8500, stock:33},
  {id:"P107", name:"Wireless Mouse", brand:"Logitech", category:"Accessories", price:1800, stock:60},
  {id:"P108", name:"Fitness Band", brand:"Mi", category:"Wearables", price:2500, stock:8},
  {id:"P109", name:"Gaming Console", brand:"Sony", category:"Gaming", price:45000, stock:10},
  {id:"P110", name:"Gaming Controller", brand:"Xbox", category:"Gaming", price:5500, stock:22},
  {id:"P111", name:"27-inch Monitor", brand:"LG", category:"Computer", price:22000, stock:14},
  {id:"P112", name:"Bluetooth Speaker", brand:"JBL", category:"Accessories", price:6000, stock:0},
  {id:"P113", name:"Earbuds", brand:"OnePlus", category:"Accessories", price:3500, stock:48},
  {id:"P114", name:"External SSD 1TB", brand:"Samsung", category:"Computer", price:9500, stock:17},
  {id:"P115", name:"Smart TV 43-inch", brand:"Mi", category:"Electronics", price:28000, stock:9},
  {id:"P116", name:"VR Headset", brand:"Meta", category:"Gaming", price:33000, stock:6},
];

let products = JSON.parse(JSON.stringify(seedData));
let editingId = null;
let sortKey = "id", sortDir = 1;

const categoryFilter = document.getElementById('categoryFilter');
function populateCategoryFilter(){
  const cats = [...new Set(products.map(p=>p.category))].sort();
  categoryFilter.innerHTML = '<option value="All">All Categories</option>' + cats.map(c=>`<option>${c}</option>`).join('');
}

function stockStatus(stock){
  if(stock === 0) return {cls:'out', label:'Out of Stock'};
  if(stock < 20) return {cls:'low', label:'Low Stock'};
  return {cls:'in', label:'In Stock'};
}

function renderStats(){
  const total = products.length;
  const value = products.reduce((s,p)=>s + p.price*p.stock, 0);
  const lowStock = products.filter(p=>p.stock < 20).length;
  const cats = new Set(products.map(p=>p.category)).size;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-icon violet">📦</div><div><div class="stat-label">Total Products</div><div class="stat-value">${total}</div></div></div>
    <div class="stat-card"><div class="stat-icon green">💰</div><div><div class="stat-label">Total Inventory Value</div><div class="stat-value">₹${value.toLocaleString('en-IN')}</div></div></div>
    <div class="stat-card"><div class="stat-icon amber">⚠️</div><div><div class="stat-label">Low Stock Alerts (&lt;20)</div><div class="stat-value">${lowStock}</div></div></div>
    <div class="stat-card"><div class="stat-icon blue">🏷️</div><div><div class="stat-label">Total Categories</div><div class="stat-value">${cats}</div></div></div>
  `;
}

function setSort(key){
  if(sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
  render();
}

function render(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const cat = categoryFilter.value;
  const stockLvl = document.getElementById('stockFilter').value;

  let list = products.filter(p=>{
    const matchesQ = !q || p.id.toLowerCase().includes(q) || p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
    const matchesCat = cat === 'All' || p.category === cat;
    const st = stockStatus(p.stock).cls;
    const matchesStock = stockLvl === 'All' || st === stockLvl;
    return matchesQ && matchesCat && matchesStock;
  });

  list.sort((a,b)=>{
    let av = a[sortKey], bv = b[sortKey];
    if(typeof av === 'string') return av.localeCompare(bv) * sortDir;
    return (av - bv) * sortDir;
  });

  const tbody = document.getElementById('tbody');
  if(list.length === 0){
    tbody.innerHTML = `<tr class="empty-row"><td colspan="7">No products match your filters.</td></tr>`;
  } else {
    tbody.innerHTML = list.map(p=>{
      const s = stockStatus(p.stock);
      return `<tr>
        <td><span class="pid">${p.id}</span></td>
        <td class="pname">${p.name}</td>
        <td>${p.brand}</td>
        <td>${p.category}</td>
        <td>₹${p.price.toLocaleString('en-IN')}</td>
        <td><span class="stock-pill ${s.cls}"><span class="dot"></span>${s.label} · ${p.stock}</span></td>
        <td>
          <div class="row-actions">
            <button class="icon-btn" onclick="openModal('${p.id}')" title="Edit">✎</button>
            <button class="icon-btn danger" onclick="deleteProduct('${p.id}')" title="Delete">🗑</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }
  renderStats();
}

function openModal(id){
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? 'Edit Product' : 'Add Product';
  if(id){
    const p = products.find(x=>x.id===id);
    document.getElementById('fName').value = p.name;
    document.getElementById('fBrand').value = p.brand;
    document.getElementById('fCategory').value = p.category;
    document.getElementById('fPrice').value = p.price;
    document.getElementById('fStock').value = p.stock;
  } else {
    ['fName','fBrand','fPrice','fStock'].forEach(f=>document.getElementById(f).value='');
    document.getElementById('fCategory').value = 'Electronics';
  }
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }

function saveProduct(){
  const name = document.getElementById('fName').value.trim();
  const brand = document.getElementById('fBrand').value.trim();
  const category = document.getElementById('fCategory').value;
  const price = parseFloat(document.getElementById('fPrice').value);
  const stock = parseInt(document.getElementById('fStock').value);
  if(!name || !brand || isNaN(price) || isNaN(stock)){ alert('Please fill in all fields.'); return; }

  if(editingId){
    const p = products.find(x=>x.id===editingId);
    Object.assign(p, {name, brand, category, price, stock});
  } else {
    const nums = products.map(p=>parseInt(p.id.slice(1))).filter(n=>!isNaN(n));
    const nextId = 'P' + (Math.max(100, ...nums) + 1);
    products.push({id:nextId, name, brand, category, price, stock});
  }
  populateCategoryFilter();
  closeModal();
  render();
}

function deleteProduct(id){
  if(!confirm('Delete this product?')) return;
  products = products.filter(p=>p.id!==id);
  populateCategoryFilter();
  render();
}

function resetData(){
  if(!confirm('Reset all inventory data to the original set?')) return;
  products = JSON.parse(JSON.stringify(seedData));
  populateCategoryFilter();
  render();
}

document.getElementById('searchInput').addEventListener('input', render);
categoryFilter.addEventListener('change', render);
document.getElementById('stockFilter').addEventListener('change', render);
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

populateCategoryFilter();
render();
</script>
</body>
</html>
